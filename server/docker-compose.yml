services:
  api:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ./data:/app/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

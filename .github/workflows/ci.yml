name: ci

on:
  push:
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run smoke
      - run: node -e "import('./src/app.js').then(() => console.log('app import ok'))"
      - name: Check mini program sources
        working-directory: ${{ github.workspace }}
        run: node scripts/check-miniprogram.mjs
